version: 2
# Dependabot vigila dependencias y acciones: abre un PR agrupado por semana cuando hay
# versión nueva o vulnerabilidad conocida. Gratis. Cada PR se revisa antes de mergear.
# Las alertas de seguridad se activan aparte, en Settings del repo.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    groups:
      npm:
        patterns:
          - '*'
    # vitest se queda en 4.x a proposito, hasta que Cloudflare lo soporte.
    # `@cloudflare/vitest-plugin` exige `vitest@^4.1.0` como peer, y lo sigue
    # exigiendo en 1.3.5, su version mas nueva al 2026-10-02. Con vitest 5 el
    # `npm ci` del CI muere con ERESOLVE antes de correr una sola prueba.
    #
    # Sin este ignore, Dependabot reabre el mismo salto imposible cada semana (fue
    # el PR #73) y, al ir en el grupo, arrastra con el a las actualizaciones seguras
    # que viajan en el mismo PR. Eso es lo que dejo una alerta de undici sin aplicar.
    # Aqui pasa con mas facilidad que en otros repos porque vitest esta fijado en
    # version EXACTA ("4.1.11"), asi que no hay rango que frene el mayor.
    #
    # Para quitarlo: comprobar con `npm view @cloudflare/vitest-plugin peerDependencies`
    # que ya acepte vitest 5, y entonces subir los dos juntos en su propio PR.
    ignore:
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: deps
    labels:
      - dependencies
